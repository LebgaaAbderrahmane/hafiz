name: hafiz
description: "Qur'an School Management Platform — Multi-tenant SaaS for Qur'an schools, tahfiz centers, and masajid."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  fl_chart: ^0.70.0
  percent_indicator: ^4.2.0
  cached_network_image: ^3.4.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.0.0

  # Backend
  supabase_flutter: ^2.17.0

  # Local Storage
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.0

  # Code Generation
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  equatable: ^2.0.0

  # Utils
  intl: ^0.20.3
  image_picker: ^1.1.0
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.0

  # Date
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  freezed: ^2.5.0
  drift_dev: ^2.22.0
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.0

  # Linting (add back after analyzer compatibility is resolved)
  # custom_lint: ^0.7.0
  # riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
